<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Pasapalabra</title>
</head>
<body>
    
    <section class="pan" id="pantalla-inicial">
        <h1>Pasapalabra</h1>
        <button id="comenzar">Comenzar Juego</button>
    </section>

    <section id="pantalla-juego">

        <div class="container">
            <span id="tiempo">60</span>
        </div>

        <div class="conte-pregu">
            <span id="letra-pregu">Z</span>
            <h2 id="pregunta">Esta es la pregunta...</h2>
            <input type="text" id="respuestas">
            <div class="botones">
                <button id="responder">Responder</button>
                <button id="pasar">Pasa Palabra</button>
            </div>
        </div>
    </section>

    <section id="pantalla-final">
        <h1>Resumen del juego</h1>
        <h3>Acertadas</h3>
        <span id="acertadas">10</span>
        <h3 id="puntaje">40% de acierto</h3>
        <button id="reiniciar">Jugar de Nuevo</button>
    </section>

    <script src="script.js"></script>

</body>
</html>
